version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: gradle
    directory: /client/android
    schedule:
      interval: weekly
    groups:
      gradle:
        patterns: ['*']

  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: weekly
