name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: ${{ matrix.language }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { language: c-cpp,       os: ubuntu-latest, build-mode: manual }
          - { language: java-kotlin, os: ubuntu-latest, build-mode: manual }
          # macos-latest is macOS 26 with only Xcode 26.x, which the CodeQL swift
          # extractor cannot trace yet (github/codeql#20669) - the job has never
          # gone green there. macos-15 still defaults to Xcode 16.x, which works.
          - { language: swift,       os: macos-15,      build-mode: manual }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Ninja
        if: matrix.language == 'c-cpp'
        run: sudo apt-get update -qq && sudo apt-get install -y ninja-build

      - name: Validate the Gradle wrapper
        if: matrix.language == 'java-kotlin'
        uses: gradle/actions/wrapper-validation@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Setup JDK 17
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        if: matrix.language == 'java-kotlin'
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install NDK + CMake
        if: matrix.language == 'java-kotlin'
        run: sdkmanager "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix['build-mode'] }}

      - name: Build core + platform + tests
        if: matrix.language == 'c-cpp'
        run: |
          cmake --preset x64-debug -DDESKHUB_LINUX_APP=OFF
          cmake --build --preset x64-debug \
            --target core_tests platform_tests integration_tests

      - name: Build the Android app
        if: matrix.language == 'java-kotlin'
        run: make build-android

      # The CodeQL extractor has to observe every swift-frontend invocation.
      # These two settings force the plainest possible compile so none of them
      # are batched or indexed away.
      - name: Build the macOS app
        if: matrix.language == 'swift'
        run: >
          make build-macos MACOS_SIGN=adhoc
          MACOS_XCARGS="SWIFT_WHOLE_MODULE_OPTIMIZATION=NO COMPILER_INDEX_STORE_ENABLE=NO"

      - name: Analyze
        uses: github/codeql-action/analyze@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          category: /language:${{ matrix.language }}
