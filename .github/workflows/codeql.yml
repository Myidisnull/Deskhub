name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: ${{ matrix.language }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { language: c-cpp,       os: ubuntu-latest, build-mode: manual }
          - { language: java-kotlin, os: ubuntu-latest, build-mode: manual }
          - { language: swift,       os: macos-latest,  build-mode: manual }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Ninja
        if: matrix.language == 'c-cpp'
        run: sudo apt-get update -qq && sudo apt-get install -y ninja-build

      - name: Validate the Gradle wrapper
        if: matrix.language == 'java-kotlin'
        uses: gradle/actions/wrapper-validation@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Setup JDK 17
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4.9.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        if: matrix.language == 'java-kotlin'
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2

      - name: Install NDK + CMake
        if: matrix.language == 'java-kotlin'
        run: sdkmanager "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@a2983b8bed1923f44751c5c43237f479442827b3 # v3.37.4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix['build-mode'] }}

      - name: Build core + platform + tests
        if: matrix.language == 'c-cpp'
        run: |
          cmake --preset x64-debug -DDESKHUB_LINUX_APP=OFF
          cmake --build --preset x64-debug \
            --target core_tests platform_tests integration_tests

      - name: Build the Android app
        if: matrix.language == 'java-kotlin'
        run: make build-android

      # Xcode 26 compiles Swift in a way the CodeQL extractor can end up seeing
      # nothing of. These two settings force the plainest possible compile so it
      # has a chance to observe every swift-frontend invocation.
      - name: Build the macOS app
        if: matrix.language == 'swift'
        run: >
          make build-macos MACOS_SIGN=adhoc
          MACOS_XCARGS="SWIFT_WHOLE_MODULE_OPTIMIZATION=NO COMPILER_INDEX_STORE_ENABLE=NO"

      - name: Analyze
        uses: github/codeql-action/analyze@a2983b8bed1923f44751c5c43237f479442827b3 # v3.37.4
        with:
          category: /language:${{ matrix.language }}
