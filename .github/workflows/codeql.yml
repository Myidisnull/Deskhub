name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: ${{ matrix.language }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { language: c-cpp,       os: ubuntu-latest, build-mode: manual }
          - { language: java-kotlin, os: ubuntu-latest, build-mode: manual }
          - { language: swift,       os: macos-15,      build-mode: manual }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Ninja
        if: matrix.language == 'c-cpp'
        run: scripts/apt-install.sh ninja-build

      - name: Cache opus
        if: matrix.language == 'c-cpp'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            third_party/opus
            !third_party/opus/src
          key: opus-host-ubuntu-latest-${{ hashFiles('scripts/build-opus.sh') }}

      - name: Build opus (static audio codec)
        if: matrix.language == 'c-cpp'
        run: scripts/build-opus.sh host

      - name: Validate the Gradle wrapper
        if: matrix.language == 'java-kotlin'
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Setup JDK 17
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        if: matrix.language == 'java-kotlin'
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install NDK + CMake
        if: matrix.language == 'java-kotlin'
        run: sdkmanager "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Cache opus for Android
        if: matrix.language == 'java-kotlin'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            third_party/opus/include
            third_party/opus/aarch64-linux-android
            third_party/opus/x86_64-linux-android
          key: opus-android-${{ hashFiles('scripts/build-opus.sh') }}

      - name: Build opus for every ABI (static audio codec)
        if: matrix.language == 'java-kotlin'
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_HOME:-$ANDROID_HOME/ndk/26.1.10909125}"
          scripts/build-opus.sh android

      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix['build-mode'] }}

      - name: Build core + platform + tests
        if: matrix.language == 'c-cpp'
        run: |
          cmake --preset x64-debug -DDESKHUB_LINUX_APP=OFF
          cmake --build --preset x64-debug \
            --target core_tests platform_tests integration_tests

      - name: Build the Android app
        if: matrix.language == 'java-kotlin'
        run: make build-android

      - name: Cache opus for macOS
        if: matrix.language == 'swift'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            third_party/opus/include
            third_party/opus/aarch64-apple-darwin
            third_party/opus/x86_64-apple-darwin
            third_party/opus/macos-universal
          key: opus-macos-${{ hashFiles('scripts/build-opus.sh') }}

      - name: Build opus (static audio codec, macOS)
        if: matrix.language == 'swift'
        run: |
          scripts/build-opus.sh aarch64-apple-darwin x86_64-apple-darwin
          test -f third_party/opus/macos-universal/libopus.a

      - name: Build the macOS app
        if: matrix.language == 'swift'
        run: >
          make build-macos MACOS_SIGN=adhoc
          MACOS_XCARGS="ARCHS=arm64 ONLY_ACTIVE_ARCH=YES
          SWIFT_WHOLE_MODULE_OPTIMIZATION=NO COMPILER_INDEX_STORE_ENABLE=NO"

      - name: Analyze
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          category: /language:${{ matrix.language }}
