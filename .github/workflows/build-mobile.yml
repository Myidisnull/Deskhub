name: build-mobile

on:
  workflow_call:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache quiche
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            third_party/quiche/include
            third_party/quiche/aarch64-apple-darwin
            third_party/quiche/x86_64-apple-darwin
            third_party/quiche/macos-universal
          key: quiche-macos-${{ hashFiles('scripts/build-quiche.sh') }}

      - name: Build quiche (static QUIC + TLS)
        run: |
          scripts/build-quiche.sh aarch64-apple-darwin x86_64-apple-darwin
          test -f third_party/quiche/macos-universal/libquiche.a

      - name: Build macOS app (make release-macos, ad-hoc signing)
        run: make release-macos MACOS_SIGN=adhoc

      - name: Verify the ad-hoc signature is well formed
        run: codesign --verify --strict --verbose=2 out/build/macos/Release/app.app

      - name: Zip app bundle
        run: ditto -c -k --keepParent out/build/macos/Release/app.app deskhub-macos.zip

      - name: Upload app
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deskhub-macos
          path: deskhub-macos.zip
          retention-days: 14
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Setup JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install NDK + CMake
        run: sdkmanager "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Cache quiche
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            third_party/quiche/include
            third_party/quiche/aarch64-linux-android
            third_party/quiche/x86_64-linux-android
          key: quiche-android-${{ hashFiles('scripts/build-quiche.sh') }}

      - name: Build quiche for every ABI (static QUIC + TLS)
        run: |
          command -v cargo-ndk >/dev/null || cargo install cargo-ndk --locked
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/26.1.10909125"
          scripts/build-quiche.sh android

      - name: Build debug APK (make build-android)
        run: make build-android

      - name: Upload apk
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deskhub-android
          path: client/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error

  ios:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache quiche
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            third_party/quiche/include
            third_party/quiche/aarch64-apple-ios-sim
            third_party/quiche/aarch64-apple-ios
          key: quiche-ios-app-${{ hashFiles('scripts/build-quiche.sh') }}

      - name: Build quiche (static QUIC + TLS)
        run: |
          scripts/build-quiche.sh aarch64-apple-ios-sim aarch64-apple-ios
          test -f third_party/quiche/aarch64-apple-ios-sim/libquiche.a

      - name: Build iOS app for Simulator (make build-ios)
        run: make build-ios
