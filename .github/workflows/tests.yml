name: tests

# Reusable: build.yml calls this on every push/PR, deploy.yml calls it before it
# is allowed to ship anything. Nothing reaches a store or a GitHub release
# without this workflow going green first.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  unit:
    name: ${{ matrix.os }} · ${{ matrix.preset }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    preset: x64-debug }
          - { os: ubuntu-latest,    preset: x64-release }
          - { os: ubuntu-24.04-arm, preset: arm64-debug }
          - { os: ubuntu-24.04-arm, preset: arm64-release }
          - { os: macos-latest,     preset: arm64-debug }
          - { os: macos-latest,     preset: arm64-release }
          - { os: windows-latest,   preset: x64-debug }
          - { os: windows-latest,   preset: x64-release }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      # submodules: the Windows configure needs the nvenc headers even though
      # this job only builds the test binaries.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Setup MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      - name: Install Ninja
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux)   sudo apt-get update -qq && sudo apt-get install -y ninja-build ;;
            macOS)   brew install ninja ;;
            Windows) choco install ninja -y ;;
          esac

      - name: Configure (app off — this job only tests core/platform/integration)
        run: cmake --preset ${{ matrix.preset }} -DDESKHUB_LINUX_APP=OFF

      - name: Build the three test binaries
        run: cmake --build --preset ${{ matrix.preset }}
             --target core_tests platform_tests integration_tests

      - name: Run them through CTest
        run: ctest --test-dir out/build/${{ matrix.preset }} --output-on-failure

  sanitizers:
    name: ${{ matrix.os }} · ${{ matrix.preset }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, preset: asan }
          - { os: ubuntu-latest, preset: tsan }
          - { os: macos-latest,  preset: asan }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install clang + ninja
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y clang ninja-build

      - name: Install ninja
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Configure (${{ matrix.preset }})
        run: cmake --preset ${{ matrix.preset }}
        env:
          CC: clang
          CXX: clang++

      - name: Build the three test binaries
        run: cmake --build --preset ${{ matrix.preset }}
             --target core_tests platform_tests integration_tests

      - name: Run them under ${{ matrix.preset }}
        run: ctest --test-dir out/build/${{ matrix.preset }} --output-on-failure
        env:
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          TSAN_OPTIONS: halt_on_error=1

  android-tests:
    name: android · ${{ matrix.abi }}
    # Google ships no aarch64-Linux emulator, so arm64-v8a is cross-compiled for
    # the compile coverage and never booted. x86_64 is the ABI that actually runs.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, abi: x86_64,    emulator: true }
          - { os: ubuntu-latest, abi: arm64-v8a, emulator: false }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      NDK_VERSION: 26.1.10909125
      BUILD_DIR: out/build/android-${{ matrix.abi }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install NDK
        run: sdkmanager "ndk;$NDK_VERSION"

      - name: Install Ninja
        run: sudo apt-get update -qq && sudo apt-get install -y ninja-build

      - name: Cross-compile the test binaries for android-${{ matrix.abi }}
        run: |
          cmake -B "$BUILD_DIR" -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/$NDK_VERSION/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=${{ matrix.abi }} \
            -DANDROID_PLATFORM=android-24 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Debug \
            -DDESKHUB_WERROR=ON \
            -DDESKHUB_CORE_TESTS=ON \
            -DDESKHUB_PLATFORM_TESTS=ON \
            -DDESKHUB_INTEGRATION_TESTS=ON
          cmake --build "$BUILD_DIR" \
            --target core_tests platform_tests integration_tests

      - name: Enable KVM for the emulator
        if: matrix.emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The action feeds `script` to the shell one line at a time, so the loop
      # has to live in a file rather than inline here.
      - name: Run them on an emulator
        if: matrix.emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 30
          arch: ${{ matrix.abi }}
          target: default
          disable-animations: true
          script: scripts/run-android-tests.sh ${{ matrix.abi }}

  ios-tests:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Ninja
        run: brew install ninja

      - name: Build the test binaries for the iOS Simulator
        run: |
          cmake -B out/build/ios-sim -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphonesimulator \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_BUILD_TYPE=Debug \
            -DDESKHUB_WERROR=ON \
            -DDESKHUB_CORE_TESTS=ON \
            -DDESKHUB_PLATFORM_TESTS=ON \
            -DDESKHUB_INTEGRATION_TESTS=ON
          cmake --build out/build/ios-sim \
            --target core_tests platform_tests integration_tests

      - name: Boot a simulator
        run: |
          udid=$(xcrun simctl list devices available -j \
            | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];print(next(x['udid'] for v in d.values() for x in v))")
          echo "SIM_UDID=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid"

      # CMake wraps every executable in an .app bundle when it targets iOS, so
      # the binary to spawn sits inside the bundle, not at the target path.
      - name: Run them on the simulator
        run: |
          for t in core/core_tests platform/platform_tests tests/integration/integration_tests; do
            name=$(basename "$t")
            echo "===== $name on the iOS Simulator ====="
            xcrun simctl spawn "$SIM_UDID" "$PWD/out/build/ios-sim/$t.app/$name"
          done

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install clang + llvm + ninja
        run: sudo apt-get update -qq && sudo apt-get install -y clang llvm ninja-build

      - name: Build + measure coverage (make coverage)
        run: make coverage

      - name: Fail if core coverage regressed
        run: scripts/check-coverage.sh

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: out/coverage
          retention-days: 14
          if-no-files-found: error
