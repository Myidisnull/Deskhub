name: test

on:
  workflow_call:

permissions:
  contents: read

jobs:
  unit:
    name: ${{ matrix.os }} · ${{ matrix.preset }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    preset: x64-debug }
          - { os: ubuntu-latest,    preset: x64-release }
          - { os: ubuntu-24.04-arm, preset: arm64-debug }
          - { os: ubuntu-24.04-arm, preset: arm64-release }
          - { os: macos-latest,     preset: arm64-debug }
          - { os: macos-latest,     preset: arm64-release }
          - { os: windows-latest,   preset: x64-debug }
          - { os: windows-latest,   preset: x64-release }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Setup MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      - name: Install Ninja
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux)   scripts/apt-install.sh ninja-build ;;
            macOS)   brew install ninja ;;
            Windows) choco install ninja -y ;;
          esac

      - name: Cache opus
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            third_party/opus
            !third_party/opus/src
          key: opus-host-${{ matrix.os }}-${{ hashFiles('scripts/build-opus.sh') }}

      - name: Build opus (static audio codec)
        shell: bash
        run: |
          scripts/build-opus.sh host 2>&1 | tee opus-build.log ||
            { grep -iE "error|LNK[0-9]" opus-build.log | tail -30 | sed 's/^/::error::/' || true
              tail -15 opus-build.log | sed 's/^/::error::/' || true
              exit 1; }

      - name: Configure (app off — this job only tests core/platform/integration)
        run: cmake --preset ${{ matrix.preset }} -DDESKHUB_LINUX_APP=OFF

      - name: Build the three test binaries
        run: cmake --build --preset ${{ matrix.preset }}
             --target core_tests platform_tests integration_tests

      - name: Run them through CTest
        run: ctest --test-dir out/build/${{ matrix.preset }} --output-on-failure

  sanitizers:
    name: ${{ matrix.os }} · ${{ matrix.preset }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, preset: asan }
          - { os: ubuntu-latest, preset: tsan }
          - { os: macos-latest,  preset: asan }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install clang + ninja
        if: runner.os == 'Linux'
        run: scripts/apt-install.sh clang ninja-build

      - name: Install ninja
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Cache opus
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            third_party/opus
            !third_party/opus/src
          key: opus-host-${{ matrix.os }}-${{ hashFiles('scripts/build-opus.sh') }}

      - name: Build opus (static audio codec)
        shell: bash
        run: scripts/build-opus.sh host

      - name: Configure (${{ matrix.preset }})
        run: cmake --preset ${{ matrix.preset }}
        env:
          CC: clang
          CXX: clang++

      - name: Build the three test binaries
        run: cmake --build --preset ${{ matrix.preset }}
             --target core_tests platform_tests integration_tests

      - name: Run them under ${{ matrix.preset }}
        run: ctest --test-dir out/build/${{ matrix.preset }} --output-on-failure
        env:
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          TSAN_OPTIONS: halt_on_error=1

  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install clang + ninja
        run: scripts/apt-install.sh clang ninja-build

      - name: Cache opus
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            third_party/opus
            !third_party/opus/src
          key: opus-host-ubuntu-latest-${{ hashFiles('scripts/build-opus.sh') }}

      - name: Build opus (static audio codec)
        run: scripts/build-opus.sh host

      - name: Build + run the libFuzzer targets (make fuzz)
        run: make fuzz
        env:
          FUZZ_SECONDS: 30
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1

      - name: Upload crash reproducers
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-crashes
          path: |
            crash-*
            oom-*
            timeout-*
            out/fuzz/corpus
          retention-days: 14
          if-no-files-found: ignore

  android-tests:
    name: android · ${{ matrix.abi }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, abi: x86_64,    emulator: true }
          - { os: ubuntu-latest, abi: arm64-v8a, emulator: false }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      NDK_VERSION: 26.1.10909125
      BUILD_DIR: out/build/android-${{ matrix.abi }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install NDK
        run: sdkmanager "ndk;$NDK_VERSION"

      - name: Install Ninja
        run: scripts/apt-install.sh ninja-build

      - name: Cache opus
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            third_party/opus/include
            third_party/opus/aarch64-linux-android
            third_party/opus/x86_64-linux-android
          key: opus-android-${{ hashFiles('scripts/build-opus.sh') }}

      - name: Build opus for every ABI (static audio codec)
        run: scripts/build-opus.sh android

      - name: Cross-compile the test binaries for android-${{ matrix.abi }}
        run: |
          cmake -B "$BUILD_DIR" -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/$NDK_VERSION/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=${{ matrix.abi }} \
            -DANDROID_PLATFORM=android-24 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Debug \
            -DDESKHUB_WERROR=ON \
            -DDESKHUB_CORE_TESTS=ON \
            -DDESKHUB_PLATFORM_TESTS=ON \
            -DDESKHUB_INTEGRATION_TESTS=ON
          cmake --build "$BUILD_DIR" \
            --target core_tests platform_tests integration_tests

      - name: Enable KVM for the emulator
        if: matrix.emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run them on an emulator
        if: matrix.emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 30
          arch: ${{ matrix.abi }}
          target: default
          disable-animations: true
          script: scripts/run-android-tests.sh ${{ matrix.abi }}

  ios-tests:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Ninja
        run: brew install ninja

      - name: Cache opus
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            third_party/opus/include
            third_party/opus/aarch64-apple-ios-sim
          key: opus-ios-sim-${{ hashFiles('scripts/build-opus.sh') }}

      - name: Build opus (static audio codec)
        run: |
          scripts/build-opus.sh aarch64-apple-ios-sim
          test -f third_party/opus/aarch64-apple-ios-sim/libopus.a

      - name: Build the test binaries for the iOS Simulator
        run: |
          cmake -B out/build/ios-sim -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphonesimulator \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_BUILD_TYPE=Debug \
            -DDESKHUB_WERROR=ON \
            -DDESKHUB_CORE_TESTS=ON \
            -DDESKHUB_PLATFORM_TESTS=ON \
            -DDESKHUB_INTEGRATION_TESTS=ON
          cmake --build out/build/ios-sim \
            --target core_tests platform_tests integration_tests

      - name: Boot a simulator
        run: |
          udid=$(xcrun simctl list devices available -j \
            | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];print(next(x['udid'] for v in d.values() for x in v))")
          echo "SIM_UDID=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid"

      - name: Run them on the simulator
        run: |
          for t in core/core_tests platform/platform_tests tests/integration/integration_tests; do
            name=$(basename "$t")
            echo "===== $name on the iOS Simulator ====="
            xcrun simctl spawn "$SIM_UDID" "$PWD/out/build/ios-sim/$t.app/$name"
          done

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install clang + llvm + ninja
        run: scripts/apt-install.sh clang llvm ninja-build

      - name: Cache opus
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            third_party/opus
            !third_party/opus/src
          key: opus-host-ubuntu-latest-${{ hashFiles('scripts/build-opus.sh') }}

      - name: Build opus (static audio codec)
        run: scripts/build-opus.sh host

      - name: Build + measure coverage (make coverage)
        run: make coverage

      - name: Fail if core coverage regressed
        run: scripts/check-coverage.sh

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: out/coverage
          retention-days: 14
          if-no-files-found: error
