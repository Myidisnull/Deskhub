name: test

on:
  workflow_call:

permissions:
  contents: read

jobs:
  unit:
    name: ${{ matrix.os }} · ${{ matrix.preset }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    preset: x64-debug }
          - { os: ubuntu-latest,    preset: x64-release }
          - { os: ubuntu-24.04-arm, preset: arm64-debug }
          - { os: ubuntu-24.04-arm, preset: arm64-release }
          - { os: macos-latest,     preset: arm64-debug }
          - { os: macos-latest,     preset: arm64-release }
          - { os: windows-latest,   preset: x64-debug }
          - { os: windows-latest,   preset: x64-release }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Setup MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      - name: Install Ninja
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux)   scripts/apt-install.sh ninja-build ;;
            macOS)   brew install ninja ;;
            Windows) choco install ninja nasm -y ;;
          esac

      - uses: ./.github/actions/third-party
        with:
          cache-key: host-${{ matrix.os }}

      - name: Configure (app off — this job only tests core/platform/integration)
        run: cmake --preset ${{ matrix.preset }} -DDESKHUB_LINUX_APP=OFF

      - name: Build the three test binaries and the perf harness
        shell: bash
        run: |
          cmake --build --preset ${{ matrix.preset }} \
              --target core_tests platform_tests integration_tests core_perf platform_perf 2>&1 | tee build.log ||
            { grep -iE "error|warning C[0-9]|LNK[0-9]" build.log | tail -40 | sed 's/^/::error::/' || true
              exit 1; }

      - name: Run them through CTest
        run: ctest --test-dir out/build/${{ matrix.preset }} --output-on-failure

      - name: Gate the hot core and QUIC paths on allocation and scaling budgets (time baselines stay per-machine; MSVC's small deque blocks make its allocation counts incomparable)
        if: endsWith(matrix.preset, '-release') && runner.os != 'Windows'
        run: |
          out/build/${{ matrix.preset }}/core/core_perf
          out/build/${{ matrix.preset }}/platform/platform_perf

  perf-compare:
    name: perf · pull request vs base
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install Ninja
        run: scripts/apt-install.sh ninja-build

      - uses: ./.github/actions/third-party
        with:
          cache-key: host-ubuntu-latest

      - name: Build the base commit and record it as this runner's baseline
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git -c advice.detachedHead=false checkout --force "$BASE_SHA"
          git submodule update --init --recursive
          cmake --preset x64-release -DDESKHUB_LINUX_APP=OFF
          cmake --build --preset x64-release --target core_perf
          DESKHUB_PERF_WRITE="$RUNNER_TEMP/base-perf.txt" out/build/x64-release/core/core_perf ||
            echo "::warning::the base commit failed its own perf budgets - drift below is still measured against it"

      - name: Build the pull request and report drift against the base run (warnings only - a shared runner is too noisy to fail on time)
        env:
          HEAD_SHA: ${{ github.sha }}
        run: |
          git checkout --force "$HEAD_SHA"
          git submodule update --init --recursive
          cmake --preset x64-release -DDESKHUB_LINUX_APP=OFF
          cmake --build --preset x64-release --target core_perf
          set -o pipefail
          if ! DESKHUB_PERF_BASELINE="$RUNNER_TEMP/base-perf.txt" DESKHUB_PERF_TOLERANCE=0.5 \
              out/build/x64-release/core/core_perf 2>&1 | tee perf.log; then
            echo "::warning::core_perf drifted from the base commit or failed a budget - details in the step summary"
            grep "FAIL:" perf.log | sed -e 's/^ *//' -e 's/^/::warning::/' || true
          fi
          { echo "## core_perf: pull request vs base commit, same runner (50% tolerance)"
            echo '```'
            cat perf.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  sanitizers:
    name: ${{ matrix.os }} · ${{ matrix.preset }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, preset: asan }
          - { os: ubuntu-latest, preset: tsan }
          - { os: macos-latest,  preset: asan }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install clang + ninja
        if: runner.os == 'Linux'
        run: scripts/apt-install.sh clang ninja-build

      - name: Install ninja
        if: runner.os == 'macOS'
        run: brew install ninja

      - uses: ./.github/actions/third-party
        with:
          cache-key: host-${{ matrix.os }}

      - name: Configure (${{ matrix.preset }})
        run: cmake --preset ${{ matrix.preset }}
        env:
          CC: clang
          CXX: clang++

      - name: Build the three test binaries
        run: cmake --build --preset ${{ matrix.preset }}
             --target core_tests platform_tests integration_tests

      - name: Run them under ${{ matrix.preset }}
        run: ctest --test-dir out/build/${{ matrix.preset }} --output-on-failure
        env:
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          TSAN_OPTIONS: halt_on_error=1

  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install clang + ninja
        run: scripts/apt-install.sh clang ninja-build

      - name: Build + run the libFuzzer targets (make fuzz)
        run: make fuzz
        env:
          FUZZ_SECONDS: 30
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1

      - name: Upload crash reproducers
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-crashes
          path: |
            crash-*
            oom-*
            timeout-*
            out/fuzz/corpus
          retention-days: 14
          if-no-files-found: ignore

  android:
    name: android · ${{ matrix.abi }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, abi: x86_64,    rust_target: x86_64-linux-android,  emulator: true }
          - { os: ubuntu-latest, abi: arm64-v8a, rust_target: aarch64-linux-android, emulator: false }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      BUILD_DIR: out/build/android-${{ matrix.abi }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/android-sdk

      - name: Install Ninja
        run: scripts/apt-install.sh ninja-build

      - uses: ./.github/actions/third-party
        with:
          targets: ${{ matrix.rust_target }}
          cache-key: ${{ matrix.rust_target }}

      - name: Cross-compile the test binaries for android-${{ matrix.abi }}
        run: |
          cmake -B "$BUILD_DIR" -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=${{ matrix.abi }} \
            -DANDROID_PLATFORM=android-24 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Debug \
            -DDESKHUB_WERROR=ON \
            -DDESKHUB_CORE_TESTS=ON \
            -DDESKHUB_PLATFORM_TESTS=ON \
            -DDESKHUB_INTEGRATION_TESTS=ON
          cmake --build "$BUILD_DIR" \
            --target core_tests platform_tests integration_tests

      - name: Enable KVM for the emulator
        if: matrix.emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run them on an emulator
        if: matrix.emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 30
          arch: ${{ matrix.abi }}
          target: default
          disable-animations: true
          script: scripts/run-android-tests.sh ${{ matrix.abi }}

  ios:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Ninja
        run: brew install ninja

      - uses: ./.github/actions/third-party
        with:
          targets: aarch64-apple-ios-sim
          cache-key: ios-sim

      - name: Build the test binaries for the iOS Simulator
        run: |
          cmake -B out/build/ios-sim -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphonesimulator \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_BUILD_TYPE=Debug \
            -DDESKHUB_WERROR=ON \
            -DDESKHUB_CORE_TESTS=ON \
            -DDESKHUB_PLATFORM_TESTS=ON \
            -DDESKHUB_INTEGRATION_TESTS=ON
          cmake --build out/build/ios-sim \
            --target core_tests platform_tests integration_tests

      - name: Boot a simulator
        run: |
          udid=$(xcrun simctl list devices available -j \
            | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];print(next(x['udid'] for v in d.values() for x in v))")
          echo "SIM_UDID=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid"

      - name: Run them on the simulator
        run: |
          for t in core/core_tests platform/platform_tests tests/integration/integration_tests; do
            name=$(basename "$t")
            echo "===== $name on the iOS Simulator ====="
            xcrun simctl spawn "$SIM_UDID" "$PWD/out/build/ios-sim/$t.app/$name"
          done

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install clang + llvm + ninja
        run: scripts/apt-install.sh clang llvm ninja-build

      - name: Build + measure coverage (make coverage)
        run: make coverage

      - name: Fail if core coverage regressed
        run: scripts/check-coverage.sh

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: out/coverage
          retention-days: 14
          if-no-files-found: error
