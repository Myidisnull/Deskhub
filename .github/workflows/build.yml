name: build

# Build + test mọi nền tảng, đẩy artifact. Khi push tag v* thì gom exe + apk vào một
# GitHub Release. Không cần secret nào: apk là bản debug (ký bằng khoá debug nên cài
# được ngay); muốn bản release đã ký thì thêm keystore + signingConfig sau.
#
# Nguyên tắc: nơi nào chạy được thì CI gọi ĐÚNG lệnh dev dùng local (make test-ctest,
# make coverage, make build-android, make build-ios, make release-macos) — CI đồng
# thời là nơi kiểm tra nhánh macOS/Ubuntu của Makefile mà máy dev Windows không tự
# chạy được.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # Core tests trên Ubuntu (gcc) + macOS (AppleClang): lõi thuần C++20, offline
  # (không mạng/GPU/submodule). Tín hiệu pass/fail ĐỘC LẬP với bản dựng artifact —
  # thấy đỏ là lỗi ở logic lõi hoặc tính portable, không phải toolchain đóng gói.
  # (MSVC được phủ ở job windows bên dưới, cũng chạy CTest.)
  # ---------------------------------------------------------------------------
  core-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4   # không cần submodule: core không đụng nvenc

      # Preset dùng generator Ninja trên mọi OS.
      - name: Install Ninja
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update -qq && sudo apt-get install -y ninja-build
          else
            brew install ninja
          fi

      - name: Build + run core tests (make test-ctest)
        run: make test-ctest

  # ---------------------------------------------------------------------------
  # Coverage của core: đúng lệnh dev chạy local (make coverage — clang instrument
  # + llvm-cov, xem Makefile). Chạy trên Ubuntu cho rẻ; toolchain cài giống hệt
  # bootstrap.sh (clang + llvm). Báo cáo HTML đẩy lên làm artifact để tải về xem;
  # chưa đặt ngưỡng % bắt buộc — bảng tổng kết in ngay trong log job.
  # ---------------------------------------------------------------------------
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4   # không cần submodule: core không đụng nvenc

      - name: Install clang + llvm + ninja
        run: sudo apt-get update -qq && sudo apt-get install -y clang llvm ninja-build

      - name: Build + measure coverage (make coverage)
        run: make coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: out/coverage
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Windows: MỘT app chứa cả hai vai (host + client) — MỘT exe Win32 thuần
  # (client/windows/win32, target deskhub_app, UI khôi phục từ bản trước M4b).
  # CMake (Ninja + MSVC) dựng tất cả trong một lượt, không dotnet/.NET runtime.
  # Core tests chạy lại trên chính toolchain MSVC trước khi xuất artifact.
  # (Không qua make: runner không có GNU make sẵn, và VsDevCmd đã có ilammy lo.)
  #
  # Artifact là ĐÚNG MỘT FILE Deskhub.exe: link tĩnh core + pipeline + UI Win32,
  # tải về là chạy.
  # ---------------------------------------------------------------------------
  windows:
    needs: core-tests
    runs-on: windows-latest
    env:
      APP_EXE: out/build/x64-release/client/windows/win32/Deskhub.exe
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive   # third_party/nvenc-13.0 (nvEncodeAPI.h) là submodule

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja
        run: choco install ninja -y

      - name: Configure
        run: cmake --preset x64-release

      - name: Build (deskhub_app + core_tests)
        run: cmake --build --preset x64-release

      - name: Run core tests (CTest, offline)
        run: ctest --test-dir out/build/x64-release --output-on-failure

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: deskhub-windows
          path: ${{ env.APP_EXE }}
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Ubuntu: MỘT app chứa cả hai vai (host + client) — một tệp `deskhub` (GTK3 +
  # native, target deskhub_app). Đây là nơi DUY NHẤT CI biên dịch nhánh
  # PipeWire/VA-API/uinput/OpenGL.
  #
  # ĐÂY CHỈ LÀ BUILD CHECK. Không có GPU, không có compositor và không có
  # /dev/uinput trên runner, nên không chạy thử được — mọi thứ ngoài "biên dịch và
  # link sạch" phải kiểm trên máy thật (docs/17-linux-app.md §8).
  #
  # ⚠ VÌ SAO CÓ MA TRẬN HAI PHIÊN BẢN, VÀ VÌ SAO ARTIFACT CHỈ LẤY TỪ 22.04
  #
  #   Binary C++ liên kết động chạy được trên bản Ubuntu MỚI HƠN bản dựng ra nó,
  #   nhưng KHÔNG chạy ngược lại. Đo thật trên cây này:
  #     dựng trên 24.04 -> đòi GLIBCXX_3.4.31   (Ubuntu 22.04 chỉ có tới 3.4.30)
  #     dựng trên 22.04 -> đòi GLIBCXX_3.4.29   (chạy được 22.04 trở lên)
  #   Nên bản PHÁT HÀNH phải dựng trên phiên bản CŨ NHẤT ta hứa hỗ trợ; lấy từ
  #   ubuntu-latest thì người dùng 22.04 nhận đúng một dòng
  #   "version `GLIBCXX_3.4.31' not found" và app không mở được.
  #
  #   Nhánh ubuntu-latest vẫn chạy vì nó phủ thứ 22.04 không phủ: toolchain mới
  #   hơn (GCC 13+) và PipeWire 1.x. Hai bản PipeWire khác nhau đủ để một API
  #   biên dịch được ở cả hai mà chỉ chạy đúng ở một bên — xem chú thích
  #   "target_id" trong capture/ScreenCapture.cpp.
  #
  #   Nếu GitHub gỡ runner ubuntu-22.04: hạ mốc hỗ trợ trong README + docs/17 §1,
  #   hoặc chuyển sang dựng trong container ubuntu:22.04.
  #
  # Cài gói -dev tay chứ không gọi bootstrap.sh: bootstrap kéo cả Android SDK/NDK,
  # quá nặng cho một job build check. Danh sách phải khớp phần Ubuntu của
  # scripts/bootstrap.sh — lệch thì CI xanh mà máy dev gãy (hoặc ngược lại).
  # ---------------------------------------------------------------------------
  linux:
    needs: core-tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04   # bản dựng ra artifact phát hành
            release: true
          - os: ubuntu-latest  # build check trên toolchain + PipeWire mới
            release: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Không cài libavcodec-dev: FFmpeg được dựng tối giản và link TĨNH ở bước
      # dưới. `nasm` là để biên dịch phần assembly x86 của nó.
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ninja-build pkg-config nasm \
            libgtk-3-dev libglib2.0-dev libepoxy-dev libegl-dev libgles-dev \
            libdrm-dev libva-dev libpipewire-0.3-dev libspa-0.2-dev

      # Dựng FFmpeg mất vài phút nên cache lại. Khoá gồm nội dung script: đổi
      # version hay bộ cờ trong đó là cache tự hỏng, không phải nhớ bump tay.
      - name: Cache minimal FFmpeg
        uses: actions/cache@v4
        with:
          path: third_party/ffmpeg-min
          key: ffmpeg-min-${{ matrix.os }}-${{ hashFiles('scripts/build-ffmpeg.sh') }}

      - name: Build minimal FFmpeg (static, h264 decode only)
        run: scripts/build-ffmpeg.sh

      # Gốc CMakeLists đòi CMake >= 3.25 còn Ubuntu 22.04 chỉ đóng gói 3.22.
      # Ảnh runner của GitHub có sẵn bản mới, nhưng kiểm tra tường minh để lỗi
      # (nếu ảnh đổi) hiện ra ngay ở đây thay vì thành một lỗi cấu hình khó hiểu.
      - name: Check CMake version
        run: |
          have=$(cmake --version | head -1 | awk '{print $3}')
          need=3.25
          echo "CMake $have (need >= $need)"
          [ "$(printf '%s\n%s\n' "$need" "$have" | sort -V | head -1)" = "$need" ] \
            || { echo "::error::CMake $have is too old — the root CMakeLists needs $need"; exit 1; }

      - name: Build the Ubuntu app (make release-linux)
        run: make release-linux

      # Chốt chặn cho đúng lý do tồn tại của bước dựng FFmpeg ở trên. Nếu binary
      # lỡ link động vào libav* trở lại thì bản phát hành dựng trên 22.04 sẽ không
      # khởi động nổi trên 24.04+ (soname .so.58 không có gói nào cài được ở đó) —
      # thà gãy ở CI còn hơn để người dùng phát hiện.
      - name: Assert no dynamic FFmpeg dependency
        run: |
          bin=out/build/x64-release/client/linux/deskhub
          if readelf -d "$bin" | grep -q 'NEEDED.*libav'; then
            echo "::error::$bin links libav* dynamically — the release would not start on newer Ubuntu"
            readelf -d "$bin" | grep NEEDED
            exit 1
          fi
          echo "OK — FFmpeg is linked statically. Dynamic dependencies:"
          readelf -d "$bin" | grep NEEDED

      # Chỉ đẩy artifact từ nhánh 22.04 — xem ⚠ ở trên.
      - name: Upload app
        if: matrix.release
        uses: actions/upload-artifact@v4
        with:
          name: deskhub-linux
          path: out/build/x64-release/client/linux/deskhub
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Android: apk debug (UI Kotlin + libdeskhub.so). NDK/CMake pin đúng phiên bản
  # build.gradle.kts đang khoá để khớp cách căn trang nhớ 16 KB.
  # ---------------------------------------------------------------------------
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK + CMake
        run: sdkmanager "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Build debug APK (make build-android)
        run: make build-android

      - name: Upload apk
        uses: actions/upload-artifact@v4
        with:
          name: deskhub-android
          path: client/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # iOS: build check cho Simulator (target `app`, không cần signing) — bắt lỗi
  # compile Swift/ObjC++/core trên toolchain Xcode. Chưa xuất artifact: bản
  # Simulator không cài được máy thật, ipa thật cần signing team (để sau).
  # ---------------------------------------------------------------------------
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build iOS app for Simulator (make build-ios)
        run: make build-ios

  # ---------------------------------------------------------------------------
  # macOS: MỘT app chứa cả hai vai (host + client). Build Release, ký ad-hoc qua
  # MACOS_SIGN=adhoc — project mặc định ký "Apple Development" (máy dev có cert,
  # runner thì không). Đây cũng là nơi duy nhất CI biên dịch nhánh
  # ScreenCaptureKit/VideoToolbox/CGEvent.
  #
  # ĐÂY CHỈ LÀ BUILD CHECK, KHÔNG PHẢI BẢN PHÁT HÀNH. Artifact ad-hoc để tải về gỡ
  # lỗi; nó CỐ Ý không được đính vào GitHub Release vì chữ ký ad-hoc đổi sau mỗi
  # build → macOS quên quyền Screen Recording/Accessibility mỗi lần cập nhật. Bản
  # phát hành thật là dmg ký Developer ID + notarize, do deploy.yml dựng khi push
  # tag (xem docs/16-release-macos.md).
  # ---------------------------------------------------------------------------
  macos:
    needs: core-tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build macOS app (make release-macos, ad-hoc signing)
        run: make release-macos MACOS_SIGN=adhoc

      - name: Zip app bundle
        run: ditto -c -k --keepParent out/build/macos/Release/app.app deskhub-macos.zip

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: deskhub-macos
          path: deskhub-macos.zip
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Release: chỉ chạy khi push tag v*. Đính exe Windows và viết body liệt kê đủ
  # các nền tảng. Tên file mang tag để tải về khỏi nhầm phiên bản.
  #
  # CHỈ CÓ Windows ở đây — các bản còn lại cần secret nên deploy.yml đính vào
  # CÙNG release này (softprops gộp file vào release đã có, không tạo bản trùng):
  #   - macOS  : dmg ký Developer ID + notarize (job macos)
  #   - Android: apk ký release, cùng keystore bản Play (job android) — apk DEBUG
  #     của job android bên trên chỉ là artifact kiểm tra, ký khoá debug nên xung
  #     đột chữ ký với bản Play, không đính vào release nữa
  #   - iOS    : không có file — ipa ký App Store không sideload được, người dùng
  #     đi đường TestFlight / App Store
  # ---------------------------------------------------------------------------
  release:
    needs: [windows, linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      # Artifact Windows chỉ còn ĐÚNG MỘT Deskhub.exe (link tĩnh) nên không nén
      # zip nữa — đính thẳng exe, tải về là chạy.
      - name: Rename with tag
        run: |
          mkdir -p out
          mv dist/deskhub-windows/Deskhub.exe "out/deskhub-${GITHUB_REF_NAME}-windows.exe"
          mv dist/deskhub-linux/deskhub "out/deskhub-${GITHUB_REF_NAME}-linux-x86_64"
          chmod +x "out/deskhub-${GITHUB_REF_NAME}-linux-x86_64"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/deskhub-${{ github.ref_name }}-windows.exe
            out/deskhub-${{ github.ref_name }}-linux-x86_64
          body: |
            | Platform | File / channel |
            |---|---|
            | Windows | `deskhub-${{ github.ref_name }}-windows.exe` — single file, just run it |
            | macOS | `deskhub-${{ github.ref_name }}-macos.dmg` — notarized, opens without warnings |
            | Ubuntu | `deskhub-${{ github.ref_name }}-linux-x86_64` — `chmod +x` and run (Ubuntu 22.04+, x86_64) |
            | Android | `deskhub-${{ github.ref_name }}-android.apk` — release-signed, same key as the Google Play build |
            | iOS | TestFlight / App Store (ipa cannot be sideloaded) |

            **Ubuntu — connecting and viewing needs nothing installed.** The binary links only against GTK3, PipeWire and
            libva, which a stock desktop already has; the H.264 decoder is compiled in, so it runs on 22.04 through 26.04
            with no FFmpeg package involved.

            **To share your screen** you need three more things:

            ```bash
            # 1. Portal backend — on Wayland an app cannot read the screen; the portal asks for you.
            sudo apt install xdg-desktop-portal xdg-desktop-portal-gnome   # KDE: -kde · sway/wlroots: -wlr

            # 2. VA-API driver — H.264 is encoded on the GPU, there is no software fallback.
            sudo apt install va-driver-all vainfo
            vainfo | grep -E 'H264.*Enc'      # must print ≥1 line, or this machine cannot host

            # 3. Write access to /dev/uinput — how mouse and keyboard get injected.
            echo 'KERNEL=="uinput", MODE="0660", GROUP="input", OPTIONS+="static_node=uinput"' \
              | sudo tee /etc/udev/rules.d/60-deskhub-uinput.rules
            sudo udevadm control --reload-rules && sudo udevadm trigger
            sudo usermod -aG input "$USER"    # then LOG OUT and back in
            ```

            macOS/Android files are attached by the deploy workflow — they may show up a few minutes after the Windows build.
