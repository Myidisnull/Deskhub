name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  preset: x64-debug }
          - { os: ubuntu-latest,  preset: x64-release }
          - { os: macos-latest,   preset: x64-debug }
          - { os: macos-latest,   preset: x64-release }
          - { os: macos-13,       preset: x64-debug }
          - { os: macos-13,       preset: x64-release }
          - { os: windows-latest, preset: x64-debug }
          - { os: windows-latest, preset: x64-release }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux)   sudo apt-get update -qq && sudo apt-get install -y ninja-build ;;
            macOS)   brew install ninja ;;
            Windows) choco install ninja -y ;;
          esac

      - name: Configure (app off — this job only tests core/platform/integration)
        run: cmake --preset ${{ matrix.preset }} -DDESKHUB_LINUX_APP=OFF

      - name: Build the three test binaries
        run: cmake --build --preset ${{ matrix.preset }}
             --target core_tests platform_tests integration_tests

      - name: Run them through CTest
        run: ctest --test-dir out/build/${{ matrix.preset }} --output-on-failure

  sanitizers:
    strategy:
      fail-fast: false
      matrix:
        preset: [asan, tsan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang + ninja
        run: sudo apt-get update -qq && sudo apt-get install -y clang ninja-build

      - name: Configure (${{ matrix.preset }})
        run: cmake --preset ${{ matrix.preset }}
        env:
          CC: clang
          CXX: clang++

      - name: Build the three test binaries
        run: cmake --build --preset ${{ matrix.preset }}
             --target core_tests platform_tests integration_tests

      - name: Run them under ${{ matrix.preset }}
        run: ctest --test-dir out/build/${{ matrix.preset }} --output-on-failure
        env:
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          TSAN_OPTIONS: halt_on_error=1

  android-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: sdkmanager "ndk;26.1.10909125"

      - name: Install Ninja
        run: sudo apt-get update -qq && sudo apt-get install -y ninja-build

      - name: Cross-compile the test binaries for android-x86_64
        run: |
          cmake -B out/build/android-x86_64 -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/26.1.10909125/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=x86_64 \
            -DANDROID_PLATFORM=android-24 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Debug \
            -DDESKHUB_CORE_TESTS=ON \
            -DDESKHUB_PLATFORM_TESTS=ON \
            -DDESKHUB_INTEGRATION_TESTS=ON
          cmake --build out/build/android-x86_64 \
            --target core_tests platform_tests integration_tests

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run them on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          disable-animations: true
          script: |
            adb wait-for-device
            adb shell mkdir -p /data/local/tmp/deskhub
            for t in core_tests platform_tests integration_tests; do
              case $t in
                core_tests)        src=out/build/android-x86_64/core/$t ;;
                platform_tests)    src=out/build/android-x86_64/platform/$t ;;
                integration_tests) src=out/build/android-x86_64/tests/integration/$t ;;
              esac
              adb push "$src" /data/local/tmp/deskhub/$t
              adb shell chmod 755 /data/local/tmp/deskhub/$t
              echo "===== $t on Android ====="
              adb shell "cd /data/local/tmp/deskhub && ./$t; echo EXIT=\$?" | tee /tmp/$t.log
              grep -q "EXIT=0" /tmp/$t.log || { echo "::error::$t failed on Android"; exit 1; }
            done

  ios-tests:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: brew install ninja

      - name: Build the test binaries for the iOS Simulator
        run: |
          cmake -B out/build/ios-sim -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphonesimulator \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_BUILD_TYPE=Debug \
            -DDESKHUB_CORE_TESTS=ON \
            -DDESKHUB_PLATFORM_TESTS=ON \
            -DDESKHUB_INTEGRATION_TESTS=ON
          cmake --build out/build/ios-sim \
            --target core_tests platform_tests integration_tests

      - name: Boot a simulator
        run: |
          udid=$(xcrun simctl list devices available -j \
            | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];print(next(x['udid'] for v in d.values() for x in v))")
          echo "SIM_UDID=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid"

      - name: Run them on the simulator
        run: |
          for t in core/core_tests platform/platform_tests tests/integration/integration_tests; do
            echo "===== $(basename $t) on the iOS Simulator ====="
            xcrun simctl spawn "$SIM_UDID" "$PWD/out/build/ios-sim/$t"
          done

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang + llvm + ninja
        run: sudo apt-get update -qq && sudo apt-get install -y clang llvm ninja-build

      - name: Build + measure coverage (make coverage)
        run: make coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: out/coverage
          if-no-files-found: error

  windows:
    needs: tests
    runs-on: windows-latest
    env:
      APP_EXE: out/build/x64-release/client/windows/win32/Deskhub.exe
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja
        run: choco install ninja -y

      - name: Configure
        run: cmake --preset x64-release

      - name: Build the Windows app
        run: cmake --build --preset x64-release

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: deskhub-windows
          path: ${{ env.APP_EXE }}
          if-no-files-found: error

  linux:
    needs: tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            release: true
          - os: ubuntu-latest
            release: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ninja-build pkg-config nasm \
            libgtk-3-dev libglib2.0-dev libepoxy-dev libegl-dev libgles-dev \
            libdrm-dev libva-dev libpipewire-0.3-dev libspa-0.2-dev

      - name: Cache minimal FFmpeg
        uses: actions/cache@v4
        with:
          path: third_party/ffmpeg-min
          key: ffmpeg-min-${{ matrix.os }}-${{ hashFiles('scripts/build-ffmpeg.sh') }}

      - name: Build minimal FFmpeg (static, h264 decode only)
        run: scripts/build-ffmpeg.sh

      - name: Check CMake version
        run: |
          have=$(cmake --version | head -1 | awk '{print $3}')
          need=3.25
          echo "CMake $have (need >= $need)"
          [ "$(printf '%s\n%s\n' "$need" "$have" | sort -V | head -1)" = "$need" ] \
            || { echo "::error::CMake $have is too old — the root CMakeLists needs $need"; exit 1; }

      - name: Build the Ubuntu app (make release-linux)
        run: make release-linux

      - name: Assert no dynamic FFmpeg dependency
        run: |
          bin=out/build/x64-release/client/linux/deskhub
          if readelf -d "$bin" | grep -q 'NEEDED.*libav'; then
            echo "::error::$bin links libav* dynamically — the release would not start on newer Ubuntu"
            readelf -d "$bin" | grep NEEDED
            exit 1
          fi
          echo "OK — FFmpeg is linked statically. Dynamic dependencies:"
          readelf -d "$bin" | grep NEEDED

      - name: Upload app
        if: matrix.release
        uses: actions/upload-artifact@v4
        with:
          name: deskhub-linux
          path: out/build/x64-release/client/linux/deskhub
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK + CMake
        run: sdkmanager "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Build debug APK (make build-android)
        run: make build-android

      - name: Upload apk
        uses: actions/upload-artifact@v4
        with:
          name: deskhub-android
          path: client/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build iOS app for Simulator (make build-ios)
        run: make build-ios

  macos:
    needs: tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build macOS app (make release-macos, ad-hoc signing)
        run: make release-macos MACOS_SIGN=adhoc

      - name: Zip app bundle
        run: ditto -c -k --keepParent out/build/macos/Release/app.app deskhub-macos.zip

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: deskhub-macos
          path: deskhub-macos.zip
          if-no-files-found: error

  release:
    needs: [windows, linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Rename with tag
        run: |
          mkdir -p out
          mv dist/deskhub-windows/Deskhub.exe "out/deskhub-${GITHUB_REF_NAME}-windows.exe"
          mv dist/deskhub-linux/deskhub "out/deskhub-${GITHUB_REF_NAME}-linux-x86_64"
          chmod +x "out/deskhub-${GITHUB_REF_NAME}-linux-x86_64"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/deskhub-${{ github.ref_name }}-windows.exe
            out/deskhub-${{ github.ref_name }}-linux-x86_64
          body: |
            | Platform | File / channel |
            |---|---|
            | Windows | `deskhub-${{ github.ref_name }}-windows.exe` — single file, just run it |
            | macOS | `deskhub-${{ github.ref_name }}-macos.dmg` — notarized, opens without warnings |
            | Ubuntu | `deskhub-${{ github.ref_name }}-linux-x86_64` — `chmod +x` and run (Ubuntu 22.04+, x86_64) |
            | Android | `deskhub-${{ github.ref_name }}-android.apk` — release-signed, same key as the Google Play build |
            | iOS | TestFlight / App Store (ipa cannot be sideloaded) |

            **Ubuntu — connecting and viewing needs nothing installed.** The binary links only against GTK3, PipeWire and
            libva, which a stock desktop already has; the H.264 decoder is compiled in, so it runs on 22.04 through 26.04
            with no FFmpeg package involved.

            **To share your screen** you need three more things:

            ```bash
            # 1. Portal backend — on Wayland an app cannot read the screen; the portal asks for you.
            sudo apt install xdg-desktop-portal xdg-desktop-portal-gnome   # KDE: -kde · sway/wlroots: -wlr

            # 2. VA-API driver — H.264 is encoded on the GPU, there is no software fallback.
            sudo apt install va-driver-all vainfo
            vainfo | grep -E 'H264.*Enc'      # must print ≥1 line, or this machine cannot host

            # 3. Write access to /dev/uinput — how mouse and keyboard get injected.
            echo 'KERNEL=="uinput", MODE="0660", GROUP="input", OPTIONS+="static_node=uinput"' \
              | sudo tee /etc/udev/rules.d/60-deskhub-uinput.rules
            sudo udevadm control --reload-rules && sudo udevadm trigger
            sudo usermod -aG input "$USER"    # then LOG OUT and back in
            ```

            macOS/Android files are attached by the deploy workflow — they may show up a few minutes after the Windows build.
