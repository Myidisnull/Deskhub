name: build

# Continuous integration for main and pull requests. Tags do not land here:
# the whole tag pipeline (tests -> clients -> GitHub release -> stores) lives in
# deploy.yml so that nothing can be published without the tests it depends on.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  apps:
    uses: ./.github/workflows/apps.yml
