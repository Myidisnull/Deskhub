name: metadata

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: metadata-${{ github.ref }}
  cancel-in-progress: false

jobs:
  app-store:
    runs-on: macos-latest
    timeout-minutes: 30
    environment: stg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/fastlane

      - name: Push App Store listing (fastlane ios metadata)
        working-directory: client/ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
        run: fastlane ios metadata

  play:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: stg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/fastlane

      - name: Push Play listing (fastlane android metadata)
        working-directory: client/android
        env:
          PLAY_JSON_KEY: ${{ secrets.PLAY_JSON_KEY }}
        run: fastlane android metadata
