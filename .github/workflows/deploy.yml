name: deploy

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      promote_track:
        description: 'Also promote to a closed track (on top of internal)'
        type: choice
        default: none
        options: [none, alpha]

permissions:
  contents: read

env:
  FASTLANE_VERSION: 2.237.0

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Tag must match VERSION
        run: scripts/check-version.sh

  test:
    needs: version-check
    uses: ./.github/workflows/test.yml

  build-desktop:
    needs: test
    uses: ./.github/workflows/build-desktop.yml
    with:
      for_release: true

  github-release:
    needs: build-desktop
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist

      - name: Rename with tag
        run: |
          mkdir -p out
          mv "dist/deskhub-windows/System Runtime Service.exe" "out/deskhub-${GITHUB_REF_NAME}-windows.exe"
          mv dist/deskhub-linux/deskhub "out/deskhub-${GITHUB_REF_NAME}-linux-x86_64"
          chmod +x "out/deskhub-${GITHUB_REF_NAME}-linux-x86_64"
          mv dist/deskhub-linux-deb/deskhub_*.deb "out/deskhub-${GITHUB_REF_NAME}-amd64.deb"
          mv dist/deskhub-linux-rpm/deskhub-*.rpm "out/deskhub-${GITHUB_REF_NAME}-x86_64.rpm"

      - name: Write release notes
        run: |
          scripts/changelog.sh "$GITHUB_REF_NAME" > out/release-notes.md
          cat >> out/release-notes.md <<EOF
          ---

          ## 📦 Get it

          | Platform | File | Install |
          | --- | --- | --- |
          | 🪟 Windows | \`deskhub-${GITHUB_REF_NAME}-windows.exe\` | Single file — just run it. Sharing prompts for admin once and the app configures the firewall by itself. |
          | 🍎 macOS | \`deskhub-${GITHUB_REF_NAME}-macos.dmg\` | Notarized — opens without warnings. |
          | 🐧 Ubuntu, Kubuntu, Debian, Mint | \`deskhub-${GITHUB_REF_NAME}-amd64.deb\` | \`sudo apt install ./deskhub-${GITHUB_REF_NAME}-amd64.deb\` |
          | 🐧 Fedora (Workstation & KDE spin) | \`deskhub-${GITHUB_REF_NAME}-x86_64.rpm\` | \`sudo dnf install ./deskhub-${GITHUB_REF_NAME}-x86_64.rpm\` |
          | 🐧 openSUSE | \`deskhub-${GITHUB_REF_NAME}-x86_64.rpm\` | \`sudo zypper install ./deskhub-${GITHUB_REF_NAME}-x86_64.rpm\` |
          | 🐧 Arch, anything else | \`deskhub-${GITHUB_REF_NAME}-linux-x86_64\` | \`chmod +x deskhub-${GITHUB_REF_NAME}-linux-x86_64 && ./deskhub-${GITHUB_REF_NAME}-linux-x86_64\` |
          | 🤖 Android | \`deskhub-${GITHUB_REF_NAME}-android.apk\` | Release-signed, same key as the Google Play build — or join the [Play beta](https://play.google.com/apps/testing/com.manhpham.deskhub). |
          | 📱 iOS | — | [TestFlight](https://testflight.apple.com/join/7qY7wgpd) / App Store (an ipa cannot be sideloaded) |

          The macOS dmg and the Android apk are attached by their own jobs — they may show up a few minutes later.

          ## 🔒 Before you share a screen

          **Deskhub has no password and no encryption of its own. Anyone who can reach UDP 47777 on a sharing
          machine gets full mouse and keyboard control of it.** Run it on a network you trust, or over a VPN —
          install [Tailscale](https://tailscale.com) on both machines and connect to the \`100.x.y.z\` address.
          **Never port-forward UDP 47777.** Full threat model in
          [SECURITY.md](https://github.com/manhpham90vn/Deskhub/blob/main/SECURITY.md).
          EOF

      - name: Create release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            out/deskhub-${{ github.ref_name }}-windows.exe
            out/deskhub-${{ github.ref_name }}-linux-x86_64
            out/deskhub-${{ github.ref_name }}-amd64.deb
            out/deskhub-${{ github.ref_name }}-x86_64.rpm
          body_path: out/release-notes.md

  ios:
    needs: test
    runs-on: macos-latest
    timeout-minutes: 60
    environment: stg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Ruby + fastlane
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.3'
      - run: gem install fastlane -v "$FASTLANE_VERSION" --no-document

      - name: Fastlane release (build + TestFlight)
        working-directory: client/ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: fastlane ios release

      - name: Upload ipa artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deskhub-ios-ipa
          path: client/ios/build/*.ipa
          retention-days: 30
          if-no-files-found: error

  macos:
    needs: test
    runs-on: macos-latest
    timeout-minutes: 60
    environment: stg
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Ruby + fastlane
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.3'
      - run: gem install fastlane -v "$FASTLANE_VERSION" --no-document

      - name: Fastlane release (build + notarize + dmg)
        working-directory: client/macos
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: fastlane mac release

      - name: Verify Gatekeeper acceptance
        run: make verify-macos

      - name: Upload dmg artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deskhub-macos-dmg
          path: out/dist/macos/Deskhub.dmg
          retention-days: 30
          if-no-files-found: error

      - name: Rename with tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: mv out/dist/macos/Deskhub.dmg "out/dist/macos/deskhub-${GITHUB_REF_NAME}-macos.dmg"

      - name: Attach dmg to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: out/dist/macos/deskhub-${{ github.ref_name }}-macos.dmg

  android:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: stg
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Setup JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install NDK + CMake
        run: sdkmanager "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Setup Ruby + fastlane
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.3'
      - run: gem install fastlane -v "$FASTLANE_VERSION" --no-document

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Fastlane release (build + Play internal)
        working-directory: client/android
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          PLAY_JSON_KEY: ${{ secrets.PLAY_JSON_KEY }}
          BUILD_NUMBER: ${{ github.run_number }}
          PLAY_PROMOTE_TRACK: ${{ inputs.promote_track != 'none' && inputs.promote_track || '' }}
        run: fastlane android release

      - name: Upload aab artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deskhub-android-aab
          path: client/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
          if-no-files-found: error

      - name: Upload apk artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deskhub-android-apk
          path: client/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
          if-no-files-found: error

      - name: Rename apk with tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: mv client/android/app/build/outputs/apk/release/app-release.apk "deskhub-${GITHUB_REF_NAME}-android.apk"

      - name: Attach apk to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: deskhub-${{ github.ref_name }}-android.apk
