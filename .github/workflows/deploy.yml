name: deploy

# The tag pipeline. Every publishing job sits behind the same test workflow the
# pull requests run, so a red test suite means nothing reaches TestFlight, Play
# or the GitHub release page.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      promote_track:
        description: 'Also promote to a closed track (on top of internal)'
        type: choice
        default: none
        options: [none, alpha]

permissions:
  contents: read

# The store pipeline must be reproducible: every job installs this exact
# fastlane instead of whatever the runner image happens to ship.
env:
  FASTLANE_VERSION: 2.237.0

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Tag must match VERSION
        run: scripts/check-version.sh

  tests:
    needs: version-check
    uses: ./.github/workflows/tests.yml

  apps:
    needs: tests
    uses: ./.github/workflows/apps.yml
    with:
      for_release: true

  github-release:
    needs: apps
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist

      - name: Rename with tag
        run: |
          mkdir -p out
          mv dist/deskhub-windows/Deskhub.exe "out/deskhub-${GITHUB_REF_NAME}-windows.exe"
          mv dist/deskhub-linux/deskhub "out/deskhub-${GITHUB_REF_NAME}-linux-x86_64"
          chmod +x "out/deskhub-${GITHUB_REF_NAME}-linux-x86_64"
          mv dist/deskhub-linux-deb/deskhub_*.deb "out/deskhub-${GITHUB_REF_NAME}-amd64.deb"
          mv dist/deskhub-linux-rpm/deskhub-*.rpm "out/deskhub-${GITHUB_REF_NAME}-x86_64.rpm"

      - name: Create release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            out/deskhub-${{ github.ref_name }}-windows.exe
            out/deskhub-${{ github.ref_name }}-linux-x86_64
            out/deskhub-${{ github.ref_name }}-amd64.deb
            out/deskhub-${{ github.ref_name }}-x86_64.rpm
          body: |
            | Platform | File / channel |
            |---|---|
            | Windows | `deskhub-${{ github.ref_name }}-windows.exe` — single file, just run it |
            | macOS | `deskhub-${{ github.ref_name }}-macos.dmg` — notarized, opens without warnings |
            | Ubuntu / Debian / Mint | `deskhub-${{ github.ref_name }}-amd64.deb` — `sudo apt install ./deskhub-${{ github.ref_name }}-amd64.deb` |
            | Fedora / openSUSE | `deskhub-${{ github.ref_name }}-x86_64.rpm` — `sudo dnf install ./…` / `sudo zypper install ./…` |
            | Arch / other Linux | `deskhub-${{ github.ref_name }}-linux-x86_64` — portable binary, `chmod +x` and run |
            | Android | `deskhub-${{ github.ref_name }}-android.apk` — release-signed, same key as the Google Play build |
            | iOS | TestFlight / App Store (ipa cannot be sideloaded) |

            **Linux — connecting and viewing needs nothing installed.** The binary links only against GTK3, PipeWire and
            libva, which a stock desktop already has; the H.264 decoder is compiled in, so no FFmpeg package is involved.
            The deb and the rpm carry identical content — pick the one your package manager understands.

            **To share your screen** three things must be in place (full per-distro guide in the README):

            1. **Screen-capture portal** — preinstalled with GNOME and KDE, nothing to do there.
               sway/river/Wayfire (wlroots compositors, no built-in backend) need `xdg-desktop-portal-wlr` · Hyprland: `-hyprland`.
            2. **VA-API driver** — H.264 is encoded on the GPU, no software fallback. Ubuntu: `sudo apt install va-driver-all vainfo` ·
               Fedora needs the RPM Fusion drivers (see README) · Arch: `libva-mesa-driver` / `intel-media-driver`.
               Then `vainfo | grep -E 'H264.*Enc'` must print ≥1 line.
            3. **Write access to `/dev/uinput`** — a udev rule the deb/rpm installs for you. Portable-binary users:
               `curl -fsSL https://raw.githubusercontent.com/manhpham90vn/Deskhub/main/scripts/setup-uinput.sh | sudo bash`

            The macOS dmg and the Android apk are attached by their own jobs — they may show up a few minutes later.

  ios:
    needs: apps
    runs-on: macos-latest
    timeout-minutes: 60
    environment: stg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Ruby + fastlane
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.3'
      - run: gem install fastlane -v "$FASTLANE_VERSION" --no-document

      - name: Fastlane release (build + TestFlight)
        working-directory: client/ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: fastlane ios release

      - name: Upload ipa artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deskhub-ios-ipa
          path: client/ios/build/*.ipa
          retention-days: 30
          if-no-files-found: error

  macos:
    needs: apps
    runs-on: macos-latest
    timeout-minutes: 60
    environment: stg
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Ruby + fastlane
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.3'
      - run: gem install fastlane -v "$FASTLANE_VERSION" --no-document

      - name: Fastlane release (build + notarize + dmg)
        working-directory: client/macos
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: fastlane mac release

      - name: Verify Gatekeeper acceptance
        run: make verify-macos

      - name: Upload dmg artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deskhub-macos-dmg
          path: out/dist/macos/Deskhub.dmg
          retention-days: 30
          if-no-files-found: error

      - name: Rename with tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: mv out/dist/macos/Deskhub.dmg "out/dist/macos/deskhub-${GITHUB_REF_NAME}-macos.dmg"

      - name: Attach dmg to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: out/dist/macos/deskhub-${{ github.ref_name }}-macos.dmg

  android:
    needs: apps
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: stg
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Setup JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install NDK + CMake
        run: sdkmanager "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Setup Ruby + fastlane
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.3'
      - run: gem install fastlane -v "$FASTLANE_VERSION" --no-document

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Fastlane release (build + Play internal)
        working-directory: client/android
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          PLAY_JSON_KEY: ${{ secrets.PLAY_JSON_KEY }}
          BUILD_NUMBER: ${{ github.run_number }}
          PLAY_PROMOTE_TRACK: ${{ inputs.promote_track != 'none' && inputs.promote_track || '' }}
        run: fastlane android release

      - name: Upload aab artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deskhub-android-aab
          path: client/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
          if-no-files-found: error

      - name: Rename apk with tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: mv client/android/app/build/outputs/apk/release/app-release.apk "deskhub-${GITHUB_REF_NAME}-android.apk"

      - name: Attach apk to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: deskhub-${{ github.ref_name }}-android.apk
