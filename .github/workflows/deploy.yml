name: deploy

# Đẩy bản phân phối đã ký qua fastlane — iOS lên TestFlight, Android lên Google Play
# track internal, macOS thành dmg đã notarize đính vào GitHub Release. Chạy khi push
# tag v* hoặc bấm tay (workflow_dispatch).
#
# VÌ SAO macOS KHÔNG LÊN CHỢ NÀO: app chứa cả vai host nên phải tắt App Sandbox
# (CGEventPost + NSEvent global monitor cần Accessibility — sandbox cấm); mà Mac App
# Store bắt buộc sandbox. Lý do đầy đủ nằm trong client/macos/app/Deskhub.entitlements
# và docs/16-release-macos.md. Bản iOS thì có mặt trên Mac theo đường "Designed for
# iPad" — cùng một ipa, không có job riêng ở đây.
#
# VÌ SAO KHÔNG CÓ JOB UBUNTU Ở FILE NÀY: bản Ubuntu không có chợ để đẩy lên và
# không có bước ký nào, nên nó chỉ là một binary đính thẳng vào GitHub Release —
# việc đó build.yml làm xong rồi (job `linux`, dựng trên ubuntu-22.04 để chạy được
# trên 22.04 trở lên). File này chỉ dành cho những nền tảng CẦN secret.
#
# Danh tính/version app do FASTLANE quản làm nguồn chuẩn duy nhất:
#   - bundle id iOS + team    : client/ios/fastlane/Appfile   (com.ios.deskhub)
#   - bundle id macOS + team  : client/macos/fastlane/Appfile (com.deskhub.macos — KHÁC
#                               bản iOS một cách có chủ ý: app khác, kênh khác)
#   - package Android         : client/android/fastlane/Appfile
#   - version hiển thị (x.y.z): file VERSION ở gốc repo (chung mọi nền tảng)
#   - build number/versionCode: github.run_number — mỗi lần chạy tự tăng
#
# Secrets khai trong ENVIRONMENT `stg` (Settings -> Environments -> stg) — job
# nào cần secret phải khai `environment: stg` mới đọc được:
#   iOS (App Store Connect > Users and Access > Integrations > API Keys):
#     ASC_KEY_ID       — Key ID của API key
#     ASC_ISSUER_ID    — Issuer ID (đầu trang Keys)
#     ASC_KEY_CONTENT  — nội dung file .p8, base64 một dòng: base64 -i AuthKey_XXX.p8
#   iOS ký bằng fastlane match (cert lưu trong repo Deskhub_certificate):
#     MATCH_GIT_URL    — remote HTTPS của repo cert, vd
#                        https://github.com/manhpham90vn/Deskhub_certificate.git
#     MATCH_PASSWORD   — passphrase mã hoá cert (đặt khi chạy match lần đầu)
#     MATCH_GIT_BASIC_AUTHORIZATION — base64 của "<user>:<PAT đọc được repo cert>":
#                        echo -n "user:ghp_xxx" | base64
#   macOS: KHÔNG cần secret mới — dùng lại đúng ba ASC_* ở trên cho notarytool, và
#          cùng bộ MATCH_* ở trên cho match (chỉ khác type: developer_id thay vì
#          appstore, xem client/macos/fastlane/Matchfile).
#   Android:
#     ANDROID_KEYSTORE_BASE64 — keystore ký release, base64: base64 -i release.keystore
#     KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD — thông số keystore ở trên
#     PLAY_JSON_KEY    — nguyên văn JSON service account (Play Console > Setup >
#                        API access), cấp quyền Release trên app com.manhpham.deskhub
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      # Push tag -> luôn `none`: chỉ đẩy internal (lên trong vài phút, không qua
      # review đầy đủ). Closed track phải qua review từng bản nên chỉ promote khi
      # bấm tay. Một versionCode nằm được trên cả internal lẫn closed cùng lúc —
      # promote không gỡ bản khỏi internal.
      promote_track:
        description: 'Promote thêm sang track closed (ngoài internal)'
        type: choice
        default: none
        options: [none, alpha]

jobs:
  # ---------------------------------------------------------------------------
  # iOS -> TestFlight. Runner macOS có sẵn Xcode + fastlane + cmake (script phase
  # "Build libcore.a (CMake)" của Deskhub.xcodeproj cần cmake). Ký bằng fastlane
  # match: cert + profile tải readonly từ repo Deskhub_certificate (setup_ci
  # trong Fastfile tự tạo keychain tạm cho runner).
  # ---------------------------------------------------------------------------
  ios:
    runs-on: macos-latest
    environment: stg
    steps:
      - uses: actions/checkout@v4

      - name: Fastlane release (build + TestFlight)
        working-directory: client/ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: fastlane ios release

      - name: Upload ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: deskhub-ios-ipa
          path: client/ios/build/*.ipa
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # macOS -> dmg đã notarize, đính vào GitHub Release. Không có chợ nào để đẩy lên
  # (lý do ở đầu file), nên "phát hành" ở đây nghĩa là ra một file tải trực tiếp mà
  # Gatekeeper mở thẳng không cảnh báo.
  #
  # Toàn bộ cơ chế nằm ở `make dist-macos` (make/macos.mk): build ký Developer ID ->
  # notarize -> staple -> dmg -> notarize + staple luôn cái dmg. Lane fastlane chỉ
  # lo lấy cert qua match và ghi tạm file .p8 cho notarytool.
  # ---------------------------------------------------------------------------
  macos:
    runs-on: macos-latest
    environment: stg
    permissions:
      contents: write   # đính dmg vào GitHub Release
    steps:
      - uses: actions/checkout@v4

      - name: Fastlane release (build + notarize + dmg)
        working-directory: client/macos
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: fastlane mac release

      # Kiểm tra đúng thứ máy người dùng sẽ thấy — bắt trường hợp notarize "thành
      # công" nhưng vé không dán được vào app.
      - name: Verify Gatekeeper acceptance
        run: make verify-macos

      - name: Upload dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: deskhub-macos-dmg
          path: out/dist/macos/Deskhub.dmg
          if-no-files-found: error

      - name: Rename with tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: mv out/dist/macos/Deskhub.dmg "out/dist/macos/deskhub-${GITHUB_REF_NAME}-macos.dmg"

      # Cùng tag với release do build.yml tạo (exe + apk) — action này gộp thêm file
      # vào release đã có, không tạo bản trùng.
      - name: Attach dmg to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/dist/macos/deskhub-${{ github.ref_name }}-macos.dmg

  # ---------------------------------------------------------------------------
  # Android -> Play internal + apk ký release đính vào GitHub Release (cho người
  # không dùng Play sideload — apk debug của build.yml ký khoá debug nên xung đột
  # chữ ký với bản Play, không dùng phát hành). NDK/CMake pin đúng phiên bản
  # build.gradle.kts. Keystore giải mã ra RUNNER_TEMP (ngoài workspace) rồi
  # truyền đường dẫn qua env cho gradle (build.gradle.kts đọc KEYSTORE_FILE).
  # ---------------------------------------------------------------------------
  android:
    runs-on: ubuntu-latest
    environment: stg
    permissions:
      contents: write   # đính apk vào GitHub Release
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK + CMake
        run: sdkmanager "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Setup Ruby + fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - run: gem install fastlane --no-document

      - name: Decode keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Fastlane release (build + Play internal)
        working-directory: client/android
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          PLAY_JSON_KEY: ${{ secrets.PLAY_JSON_KEY }}
          BUILD_NUMBER: ${{ github.run_number }}
          # Rỗng khi push tag (context `inputs` trống) hoặc khi chọn `none`.
          PLAY_PROMOTE_TRACK: ${{ inputs.promote_track != 'none' && inputs.promote_track || '' }}
        run: fastlane android release

      - name: Upload aab artifact
        uses: actions/upload-artifact@v4
        with:
          name: deskhub-android-aab
          path: client/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Rename apk with tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: mv client/android/app/build/outputs/apk/release/app-release.apk "deskhub-${GITHUB_REF_NAME}-android.apk"

      # Cùng release do build.yml tạo (exe Windows) — action gộp thêm file vào
      # release đã có, không tạo bản trùng (giống job macos ở trên).
      - name: Attach apk to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: deskhub-${{ github.ref_name }}-android.apk
